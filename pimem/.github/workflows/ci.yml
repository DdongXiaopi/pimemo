name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 兼容两种发布布局：
      #   - 以 pimem/ 为仓库根（推荐），或
      #   - 以含 pimem/ 的外层目录为仓库根
      - name: Locate package root
        id: loc
        run: |
          if [ -f pyproject.toml ]; then echo "dir=." >> "$GITHUB_OUTPUT"; else echo "dir=pimem" >> "$GITHUB_OUTPUT"; fi

      - name: Install
        working-directory: ${{ steps.loc.outputs.dir }}
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run test suite
        working-directory: ${{ steps.loc.outputs.dir }}
        run: pytest

  offline-evidence-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Locate package root
        id: loc
        run: |
          if [ -f pyproject.toml ]; then echo "dir=." >> "$GITHUB_OUTPUT"; else echo "dir=pimem" >> "$GITHUB_OUTPUT"; fi
      - name: Install
        working-directory: ${{ steps.loc.outputs.dir }}
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Offline evidence-recall smoke (synthetic fixture, no API, no dataset)
        working-directory: ${{ steps.loc.outputs.dir }}
        run: pytest tests/test_longmemeval.py -v
